<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Travelpoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous">
<style>
:root{--pine:#1f4a3a;--pine-d:#153429;--pine-m:#4f7565;--pine-l:#e3ece6;--paper:#f6f2e8;--card:#fcfaf4;--line:#ddd5c2;--ink:#1d2a24;--muted:#545e58;--clay:#b5532f;--err:#9e2a1f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:400 16px/1.55 Archivo,'Helvetica Neue',Arial,sans-serif}
.page{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.logo{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:800;font-stretch:80%;font-size:26px;letter-spacing:-.01em;line-height:1}
.logo svg{flex:none}

/* panneau vert */
aside{background:var(--pine);color:var(--paper);padding:40px clamp(24px,4vw,56px);display:flex;flex-direction:column;justify-content:space-between;gap:40px;position:relative;overflow:hidden}
aside .logo{color:var(--paper)}
aside h1{margin:0;font-weight:800;font-stretch:66%;font-size:clamp(46px,6.4vw,92px);line-height:.92;letter-spacing:-.01em;max-width:9em}
aside p{margin:18px 0 0;max-width:30ch;color:#dfe8e2;font-size:18px}
.trajet{position:absolute;right:-30px;bottom:-10px;width:min(400px,75%);opacity:.5;pointer-events:none;z-index:0}
aside>*:not(.trajet){position:relative;z-index:1}
.trajet path{stroke-dasharray:3 9;animation:marche 1.6s ease-out both}
@keyframes marche{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}

/* formulaire */
main{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 24px}
.boite{width:100%;max-width:400px;display:flex;flex-direction:column;gap:26px}
.onglets{display:flex;gap:28px;border-bottom:1.5px solid var(--line)}
.onglets button{font:inherit;font-weight:700;font-size:17px;border:0;background:transparent;color:var(--muted);padding:8px 0 12px;min-height:44px;cursor:pointer;margin-bottom:-1.5px;border-bottom:3px solid transparent}
.onglets button[aria-selected=true]{color:var(--pine);border-bottom-color:var(--pine)}
.onglets button:hover{color:var(--ink)}
form{display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:700}
input{font:inherit;font-weight:400;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-height:46px}
input:hover{border-color:var(--pine-m)}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
input:focus-visible{outline-offset:0;border-color:var(--pine)}
.aide{font-size:13.5px;font-weight:400;color:var(--muted)}
.go{font:inherit;font-weight:700;font-size:17px;background:var(--pine);color:#fff;border:0;border-radius:999px;padding:13px 20px;min-height:50px;cursor:pointer;margin-top:4px;transition:background .15s}
.go:hover{background:var(--pine-d)}.go:disabled{opacity:.6;cursor:wait}
.erreur{color:var(--err);font-size:15px;font-weight:700;margin:0;min-height:1px}
.retour{align-self:flex-start;color:var(--pine);font-weight:700;text-underline-offset:4px}
[hidden]{display:none!important}
.regles{list-style:none;margin:-4px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.regles li .okk{display:none}
.regles li.ok{color:var(--pine);font-weight:700}
.regles li.ok .okk{display:inline-block}
.regles li.ok .ko{display:none}
.regles .bi{margin-right:4px}

@media(max-width:860px){
  .page{grid-template-columns:1fr}
  aside{padding:24px 24px 28px;gap:20px;min-height:0}
  aside h1{font-size:clamp(40px,12vw,60px)}
  aside p,.trajet{display:none}
  main{padding:28px 20px 48px;align-items:stretch}
  .boite{max-width:none}
}
@media(prefers-reduced-motion:reduce){.trajet path{animation:none}.go{transition:none}}
</style>
</head>
<body>
<div class="page">
<aside>
  <a class="logo" href="/" aria-label="Travelpoint, accueil">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
    Travelpoint
  </a>
  <div>
    <h1>Les restaurants vus en vidéo, rangés pour y aller.</h1>
    <p>Ta liste, tes notes et tes restos testés, au même endroit.</p>
  </div>
  <svg class="trajet" viewBox="0 0 520 220" fill="none" aria-hidden="true">
    <path d="M10 200 C 120 200, 140 90, 250 110 S 390 40, 470 60" stroke="#4f7565" stroke-width="3" stroke-linecap="round"/>
    <g fill="#f6f2e8"><circle cx="10" cy="200" r="6"/><circle cx="250" cy="110" r="6"/></g>
    <path d="M470 60 c-14-14-24-26-24-40a24 24 0 0 1 48 0c0 14-10 26-24 40z" fill="#b5532f"/><circle cx="470" cy="20" r="8" fill="#f6f2e8"/>
  </svg>
</aside>
<main>
  <div class="boite">
    <div class="onglets" role="tablist" aria-label="Choix">
      <button type="button" role="tab" id="t-connexion" aria-selected="true" aria-controls="f-connexion">Se connecter</button>
      <button type="button" role="tab" id="t-inscription" aria-selected="false" aria-controls="f-inscription">Créer un compte</button>
    </div>
    <form id="f-connexion" role="tabpanel" aria-labelledby="t-connexion">
      <label>E-mail ou pseudo<input name="identifiant" autocomplete="username" required maxlength="200"></label>
      <label>Mot de passe<input name="mdp" type="password" autocomplete="current-password" required maxlength="200"></label>
      <p class="erreur" role="alert"></p>
      <button class="go">Se connecter</button>
    </form>
    <form id="f-inscription" role="tabpanel" aria-labelledby="t-inscription" hidden>
      <label>Pseudo<input name="pseudo" autocomplete="nickname" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_.\-]{3,30}"><span class="aide">3 à 30 caractères : lettres, chiffres, point, tiret ou _</span></label>
      <label>E-mail<input name="email" type="email" autocomplete="email" required maxlength="200"></label>
      <label>Mot de passe<input name="mdp" type="password" autocomplete="new-password" required minlength="12" maxlength="200" aria-describedby="regles"></label>
      <ul class="regles" id="regles" aria-live="polite">
        <li data-regle="long"><i class="bi bi-circle ko" aria-hidden="true"></i><i class="bi bi-check-lg okk" aria-hidden="true"></i> 12 caractères minimum</li>
        <li data-regle="maj"><i class="bi bi-circle ko" aria-hidden="true"></i><i class="bi bi-check-lg okk" aria-hidden="true"></i> Une majuscule</li>
        <li data-regle="min"><i class="bi bi-circle ko" aria-hidden="true"></i><i class="bi bi-check-lg okk" aria-hidden="true"></i> Une minuscule</li>
        <li data-regle="chiffre"><i class="bi bi-circle ko" aria-hidden="true"></i><i class="bi bi-check-lg okk" aria-hidden="true"></i> Un chiffre</li>
        <li data-regle="special"><i class="bi bi-circle ko" aria-hidden="true"></i><i class="bi bi-check-lg okk" aria-hidden="true"></i> Un caractère spécial (! ? @ # - …)</li>
      </ul>
      <p class="erreur" role="alert"></p>
      <button class="go">Créer mon compte</button>
    </form>
    <a class="retour" href="/">Retour à l’accueil</a>
  </div>
</main>
</div>
<script>
const suite=(()=>{const s=new URLSearchParams(location.search).get('suite')||'';return /^\/(?!\/)[\w\/-]*$/.test(s)?s:'/app'})();  // jamais vers un autre site
const msg=d=>Array.isArray(d)?d.map(x=>{const champ=(x.loc||[]).slice(1).join('.');return (champ?champ+' : ':'')+String(x.msg||'').replace(/^Value error, /,'')}).join('\n'):d||'Erreur';
function onglet(nom){
  for(const n of ['connexion','inscription']){
    document.getElementById('t-'+n).setAttribute('aria-selected',n===nom);
    document.getElementById('f-'+n).hidden=n!==nom;
  }
  document.querySelector('#f-'+nom+' input').focus();
}
const REGLES={long:v=>v.length>=12,maj:v=>/[A-Z]/.test(v),min:v=>/[a-z]/.test(v),chiffre:v=>/\d/.test(v),special:v=>/[^A-Za-z0-9]/.test(v)};
const mdpNeuf=document.querySelector('#f-inscription [name=mdp]');
mdpNeuf.oninput=()=>{
  let tout=true;
  for(const [r,ok] of Object.entries(REGLES)){const b=ok(mdpNeuf.value);tout=tout&&b;document.querySelector(`[data-regle=${r}]`).classList.toggle('ok',b)}
  mdpNeuf.setCustomValidity(tout?'':'Le mot de passe ne respecte pas encore toutes les règles.');
};
document.getElementById('t-connexion').onclick=()=>onglet('connexion');
document.getElementById('t-inscription').onclick=()=>onglet('inscription');
for(const [id,route] of [['f-connexion','/api/connexion'],['f-inscription','/api/inscription']]){
  const f=document.getElementById(id);
  f.onsubmit=async e=>{
    e.preventDefault();
    const btn=f.querySelector('.go'),err=f.querySelector('.erreur');
    btn.disabled=true;err.textContent='';
    try{
      const r=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});
      if(r.ok){location.href=suite;return}
      err.textContent=msg((await r.json().catch(()=>({}))).detail);
    }catch(x){err.textContent='Serveur injoignable.'}
    btn.disabled=false;
  };
}
fetch('/api/moi').then(r=>{if(r.ok)location.href=suite});  // deja connecte
</script>
</body>
</html>
